<!DOCTYPE html>
<html lang="fr">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Mes Flashcards d'Anglais</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            display: flex;
            flex-direction: column;
            align-items: center;
            background-color: #f0f2f5;
            margin-top: 50px;
        }
        h1 {
            color: #333;
        }
        p {
            color: #666;
            margin-bottom: 30px;
        }
        /* Conteneur 3D pour la carte */
        .scene {
            width: 350px;
            height: 250px;
            perspective: 600px;
            margin-bottom: 20px;
            cursor: pointer;
        }
        /* La carte elle-même */
        .card {
            width: 100%;
            height: 100%;
            position: relative;
            transition: transform 0.6s;
            transform-style: preserve-3d;
            box-shadow: 0 8px 16px rgba(0,0,0,0.2);
            border-radius: 15px;
        }
        /* Classe ajoutée lors du clic pour retourner la carte */
        .card.is-flipped {
            transform: rotateY(180deg);
        }
        /* Les deux faces de la carte */
        .card__face {
            position: absolute;
            width: 100%;
            height: 100%;
            backface-visibility: hidden;
            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;
            text-align: center;
            border-radius: 15px;
            padding: 20px;
            box-sizing: border-box;
            font-size: 1.2rem;
        }
        /* Face avant (Définition) */
        .card__face--front {
            background: white;
            color: #333;
            border: 2px solid #e0e0e0;
        }
        /* Face arrière (Réponse) */
        .card__face--back {
            background: #4CAF50;
            color: white;
            transform: rotateY(180deg);
        }
        .translation {
            font-size: 1rem;
            margin-top: 15px;
            font-style: italic;
            opacity: 0.9;
        }
        /* Boutons de navigation */
        .controls {
            display: flex;
            gap: 15px;
        }
        button {
            padding: 10px 20px;
            font-size: 1rem;
            cursor: pointer;
            border: none;
            border-radius: 8px;
            background: #007bff;
            color: white;
            transition: background 0.3s;
        }
        button:hover {
            background: #0056b3;
        }
    </style>
</head>
<body>

    <h1>Vocabulaire Anglais</h1>
    <p>Cliquez sur la carte pour voir la réponse !</p>

    <div class="scene">
        <div class="card" id="flashcard">
            <div class="card__face card__face--front" id="front-text">
                </div>
            <div class="card__face card__face--back">
                <div id="back-word" style="font-weight: bold; font-size: 1.5rem;"></div>
                <div class="translation" id="back-translation"></div>
            </div>
        </div>
    </div>

    <div class="controls">
        <button onclick="prevCard()">Précédent</button>
        <span id="counter" style="align-self: center; font-weight: bold; color: #555;"></span>
        <button onclick="nextCard()">Suivant</button>
    </div>

    <script>
        // La liste complète de vos 32 mots
        const vocab = [
            { def: "delaying doing something you're supposed to do", word: "procrastination", fr: "procrastination" },
            { def: "something that is more important than other things", word: "priority", fr: "priorité" },
            { def: "reduce", word: "minimize", fr: "réduire" },
            { def: "start working hard", word: "knuckle down", fr: "se mettre sérieusement au travail" },
            { def: "boring", word: "tedious", fr: "ennuyeux" },
            { def: "doing two activities together: one useful + one enjoyable", word: "temptation bundling", fr: "associer tâche utile + activité plaisir" },
            { def: "a mistaken belief or idea", word: "fallacy", fr: "erreur de raisonnement" },
            { def: "polite informal conversation about unimportant topics", word: "small talk", fr: "conversation légère" },
            { def: "feeling uncomfortable or embarrassed", word: "awkward", fr: "mal à l'aise / gênant" },
            { def: "rules of acceptable behaviour in society", word: "etiquette", fr: "règles de politesse" },
            { def: "starting a friendly conversation with someone new", word: "breaking the ice", fr: "briser la glace" },
            { def: "someone who doesn't share personal information easily", word: "private", fr: "réservé" },
            { def: "ill-mannered or unpleasant", word: "rude", fr: "impoli" },
            { def: "forgot something", word: "slipped my mind", fr: "j'ai oublié" },
            { def: "an area of business within the economy", word: "a sector", fr: "un secteur économique" },
            { def: "a natural and unavoidable part of something", word: "inherent", fr: "inhérent" },
            { def: "to be successful (for a company)", word: "to perform", fr: "réussir" },
            { def: "strongest or most common", word: "dominant", fr: "dominant / principal" },
            { def: "to raise something to a higher level", word: "to escalate", fr: "faire remonter / aggraver" },
            { def: "increase in intensity or seriousness", word: "escalation", fr: "montée / aggravation" },
            { def: "to handle or resolve a problem", word: "to deal with", fr: "gérer / résoudre" },
            { def: "a workday spent outside the office with colleagues", word: "awayday", fr: "journée d'équipe hors bureau" },
            { def: "an expert in a field", word: "guru", fr: "expert" },
            { def: "activities to improve teamwork", word: "team building", fr: "activités de cohésion" },
            { def: "intellectual, related to thinking", word: "cerebral", fr: "intellectuel" },
            { def: "making you feel nervous or afraid", word: "intimidating", fr: "intimidant" },
            { def: "to get along well with someone", word: "gel", fr: "bien s'entendre" },
            { def: "hurry up / get moving", word: "shake a leg", fr: "bouge-toi" },
            { def: "short period of intense training", word: "bootcamp", fr: "entraînement intensif" },
            { def: "gentle physical exercises", word: "callisthenics", fr: "exercices physiques doux" },
            { def: "art of beautiful handwriting", word: "calligraphy", fr: "calligraphie" },
            { def: "to happen at the same time", word: "synchronise", fr: "synchroniser" }
        ];

        // Fonction pour mélanger aléatoirement le tableau (Algorithme de Fisher-Yates)
        function shuffleArray(array) {
            for (let i = array.length - 1; i > 0; i--) {
                const j = Math.floor(Math.random() * (i + 1));
                [array[i], array[j]] = [array[j], array[i]];
            }
        }

        // On mélange les cartes dès le chargement
        shuffleArray(vocab);

        let currentIndex = 0;
        const card = document.getElementById('flashcard');
        const frontText = document.getElementById('front-text');
        const backWord = document.getElementById('back-word');
        const backTranslation = document.getElementById('back-translation');
        const counter = document.getElementById('counter');

        function loadCard() {
            // Remplir le texte
            frontText.innerText = vocab[currentIndex].def;
            backWord.innerText = vocab[currentIndex].word;
            backTranslation.innerText = "(" + vocab[currentIndex].fr + ")";
            counter.innerText = (currentIndex + 1) + " / " + vocab.length;
            
            // Si la carte est retournée, la remettre à l'endroit avant de changer de mot
            if (card.classList.contains('is-flipped')) {
                card.classList.remove('is-flipped');
                // Attendre la fin de l'animation pour changer le texte au dos
                setTimeout(() => { }, 300);
            }
        }

        // Événement pour retourner la carte au clic
        card.addEventListener('click', function() {
            card.classList.toggle('is-flipped');
        });

        // Bouton Suivant
        function nextCard() {
            currentIndex = (currentIndex + 1) % vocab.length;
            loadCard();
        }

        // Bouton Précédent
        function prevCard() {
            currentIndex = (currentIndex - 1 + vocab.length) % vocab.length;
            loadCard();
        }

        // Charger la première carte au démarrage
        loadCard();
    </script>
</body>
</html>
